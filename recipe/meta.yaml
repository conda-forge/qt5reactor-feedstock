{% set name = "qt5reactor" %}
{% set version = "0.6.3" %}
{% set sha256 = "c3470a8a25d9a339f9ca6243502a9b2277f181d772b7acbff551d5bc363b7572" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: {{ sha256 }}

build:
  number: 1
  noarch: python
  script: {{ PYTHON }} -m pip install . --no-deps -vv

requirements:
  host:
    - python {{ python_min }}
    - pip
  run:
    - python >={{ python_min }}
    - pyqt >=5
    - twisted

test:
  requires:
    - python {{ python_min }}
  imports:
    - qt5reactor

about:
  home: https://github.com/sunu/qt5reactor
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: Twisted Qt Integration

extra:
  recipe-maintainers:
    - mrakitin
